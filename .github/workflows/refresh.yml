name: Refresh from sheet

# Rebuilds the page from the Google Sheet and commits the result, so the live
# site can be updated without a terminal:
#
#   github.com/fang89/food-recommendation -> Actions -> Refresh from sheet
#   -> Run workflow
#
# It does the full job the browser's "Pull from sheet" button cannot: it
# re-geocodes from the private postal-code tab, recomputes the bounding box,
# and commits the result, so the change survives a reload.

on:
  workflow_dispatch:          # the "Run workflow" button
  schedule:
    - cron: "0 20 * * 0"      # Mondays 04:00 Singapore, in case nobody presses it

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the sheet and rebuild
        env:
          # Routing is the one OneMap service that needs a login. Add these two
          # under Settings -> Secrets and variables -> Actions. Without them the
          # build still succeeds; travel times just fall back to distance.
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
        run: |
          python3 build/refresh.py
          python3 build/build.py

      - name: Test the sheet reader
        run: python3 build/test_refresh.py

      - name: Smoke test the built page
        run: python3 build/smoke.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html data build/geocache.json; then
            echo "Sheet has not changed since the last build."
            exit 0
          fi
          git add index.html data build/geocache.json
          git commit -m "Refresh from sheet"
          git push
